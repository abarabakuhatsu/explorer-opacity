[package]
name = "explorer-opacity"
version = "0.1.2"
edition = "2021"
description = "Lightweight resident tool that keeps File Explorer windows translucent on Windows"
license = "MIT"
repository = "https://github.com/abarabakuhatsu/explorer-opacity"

[lib]
name = "explorer_opacity"
path = "src/lib.rs"

[[bin]]
name = "explorer-opacity"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
